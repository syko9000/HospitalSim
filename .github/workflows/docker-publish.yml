name: Build and publish images

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: "registration"
            dockerfile: "src/HospitalSim.Registration/Dockerfile"
          - image_suffix: "sink"
            dockerfile: "src/HospitalSim.Sink/Dockerfile"
          - image_suffix: "clinicals"
            dockerfile: "src/HospitalSim.Clinicals/Dockerfile"
          - image_suffix: "ancillary"
            dockerfile: "src/HospitalSim.Ancillary/Dockerfile"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR (and Docker image refs generally) require an all-lowercase path; github.repository
      # preserves the repo's actual casing ("syko9000/HospitalSim"), which would make the push fail.
      - name: Lowercase repository name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags specifically for each image (e.g., ghcr.io/syko9000/hospitalsim-registration:latest)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Only needed for the final stage's arm64 layers (a plain COPY, not a compile - the build stage
      # itself is pinned to --platform=$BUILDPLATFORM and publishes a portable, RID-less DLL, so QEMU
      # never has to emulate the actual dotnet build).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}
