services:
  registration:
    build:
      context: .
      dockerfile: src/HospitalSim.Registration/Dockerfile
    environment:
      # "localhost" won't reach a receiver on the host or another container from in here - point this
      # at the actual receiver: host.docker.internal, a shared Docker network hostname, or the real
      # host's address. Pointing this at the sink service works too (registration -> host.docker.internal
      # if sink is also compose-managed here, or "sink" if both are on the same compose network).
      HOSPITALSIM_MLLP_HOST: host.docker.internal
      HOSPITALSIM_MLLP_PORT: "6661"
      HOSPITALSIM_INTERVAL_SECONDS: "5"
    extra_hosts:
      # host.docker.internal resolves automatically on Docker Desktop (Mac/Windows) but not on plain
      # Linux Docker Engine - this makes it resolve there too (Docker 20.10+).
      - "host.docker.internal:host-gateway"
    ports:
      - "6660:6660"
    volumes:
      - hospital-sim-data:/data
    restart: unless-stopped

  sink:
    build:
      context: .
      dockerfile: src/HospitalSim.Sink/Dockerfile
    ports:
      - "6670:6670"
    restart: unless-stopped

  clinicals:
    build:
      context: .
      dockerfile: src/HospitalSim.Clinicals/Dockerfile
    environment:
      # Where orders go - see the note on registration's HOSPITALSIM_MLLP_HOST above, same idea.
      CLINICALS_ORDER_MLLP_HOST: host.docker.internal
      CLINICALS_ORDER_MLLP_PORT: "6662"
      CLINICALS_ORDER_INTERVAL_SECONDS: "20"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6680:6680"
    volumes:
      - clinicals-data:/data
    restart: unless-stopped

volumes:
  hospital-sim-data:
  clinicals-data:
